<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tela Viva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:wght@400;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: editor em três painéis flutuantes (criar | canvas | propriedades) sobre um fundo neutro esverdeado */
:root{
  --bg:#e8ece8;--panel:#fafbfa;--panel2:#f0f3f0;--line:#d6ddd8;--fg:#14201b;--muted:#5f6e67;
  --accent:#0c7a69;--accent-fg:#ffffff;--accent-soft:#d5ede6;--canvas:#d7ddd8;--danger:#b3382c;--guide:#e5389a;
  --shadow:0 1px 2px rgba(10,30,20,.08),0 8px 24px rgba(10,30,20,.07);
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1311;--panel:#151c19;--panel2:#1b2420;--line:#28332e;--fg:#e5ece8;--muted:#8a998f;
  --accent:#3fd2b4;--accent-fg:#04201a;--accent-soft:#163229;--canvas:#0a0e0c;--danger:#ff8274;--guide:#ff5cae;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311;--panel:#151c19;--panel2:#1b2420;--line:#28332e;--fg:#e5ece8;--muted:#8a998f;
  --accent:#3fd2b4;--accent-fg:#04201a;--accent-soft:#163229;--canvas:#0a0e0c;--danger:#ff8274;--guide:#ff5cae;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);padding-left:0;padding-right:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:290px minmax(0,1fr) 308px;grid-template-rows:auto minmax(0,1fr);gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.pbody{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.brand{display:flex;align-items:center;gap:8px;font:800 17px var(--display);letter-spacing:-.02em;margin-right:4px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
#pname{width:150px;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-weight:600}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--panel2)}
.grow{flex:1}
.sep{width:1px;height:22px;background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:7px;cursor:pointer;color:var(--fg);padding:0}
.ib:hover{background:var(--panel2);border-color:var(--line)}
.ib[aria-pressed=true],.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.ic{display:block;flex:none}
#status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
#status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#status .dot{animation:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:10px 6px;background:none;border:0;border-bottom:2px solid transparent;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{color:var(--fg);border-color:var(--accent)}
.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;display:block}
.hint{font-size:12px;color:var(--muted)}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:76px;line-height:1.45}
textarea.code{font:12px/1.45 var(--mono);min-height:140px;white-space:pre;overflow:auto}
input[type=color]{width:34px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);flex:none;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field small{font-size:11px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.ai{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ai textarea{background:var(--panel);min-height:62px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 9px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.addgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.addbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;font-size:12px;font-weight:600}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.layer:hover{background:var(--panel2)}
.layer.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer.over{border-top:2px solid var(--accent)}
.layer .ib{width:24px;height:24px}
#center{background:var(--canvas)}
#vp{flex:1;overflow:auto;position:relative;min-height:0;touch-action:pan-x pan-y}
#stage{padding:36px;width:max-content;min-width:100%}
#pagewrap{position:relative;margin:0 auto}
#page{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18),0 18px 50px rgba(0,0,0,.18);overflow:hidden}
.el{position:absolute;user-select:none;-webkit-user-select:none;touch-action:none}
.el:hover{outline:1px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:0}
.el.editing{user-select:text;-webkit-user-select:text;outline:2px solid var(--accent);cursor:text}
.el.hid{display:none}
.ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(0,0,0,.35)}
#ov{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:1.5px solid var(--accent);pointer-events:none}
.h{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:1.5px solid var(--accent);border-radius:2px;pointer-events:auto;touch-action:none}
.gl{position:absolute;background:var(--guide);pointer-events:none}
#zoomv{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(4,12,9,.6);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.mcard h2{margin:0;font:700 20px var(--display);letter-spacing:-.01em}
#prevmodal{padding:12px}
#prevcard{width:min(1280px,100%);height:100%;max-width:100%;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#prevbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#prevbody{flex:1;min-height:0;display:grid;place-items:center;background:var(--canvas);padding:12px}
#prevframe{border:0;background:#fff;height:100%;border-radius:8px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;z-index:80;max-width:calc(100% - 32px)}
.notice{font-size:12px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel2)}
@media (max-width:960px){
  #app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:auto}
  #top{order:-2}#center{order:-1;height:64vh}
  #pname{width:110px}
  .pbody{overflow:visible}
}
</style>
</head><body>
<div id="app">
  <header id="top">
    <div class="brand"><i data-ic="spark" data-s="14"></i>Tela Viva</div>
    <input id="pname" type="text" aria-label="Nome do projeto" value="Meu site">
    <span class="sep"></span>
    <button class="ib" id="undo" title="Desfazer (Ctrl+Z)" data-ic="undo"></button>
    <button class="ib" id="redo" title="Refazer (Ctrl+Shift+Z)" data-ic="redo"></button>
    <span class="sep"></span>
    <div class="seg" role="group" aria-label="Versão">
      <button id="fd" aria-pressed="true"><span data-ic="desktop" data-s="15"></span>Desktop</button>
      <button id="fm" aria-pressed="false"><span data-ic="phone" data-s="15"></span>Celular</button>
    </div>
    <div class="row" style="gap:2px">
      <button class="ib" id="zout" title="Diminuir zoom" data-ic="minus"></button>
      <span id="zoomv">70%</span>
      <button class="ib" id="zin" title="Aumentar zoom" data-ic="plus"></button>
      <button class="ib" id="zfit" title="Ajustar à tela" data-ic="fit"></button>
    </div>
    <span class="grow"></span>
    <div id="status" hidden><span class="dot"></span><span id="stxt">Pensando…</span><button class="btn" id="stop"><span data-ic="stop" data-s="13"></span>Parar</button></div>
    <button class="btn" id="bprev"><span data-ic="play" data-s="14"></span>Visualizar</button>
    <button class="btn primary" id="bexp"><span data-ic="download" data-s="14"></span>Exportar</button>
  </header>

  <aside class="panel" id="left" aria-label="Criar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="ia" aria-selected="true">Criar com IA</button>
      <button class="tab" role="tab" data-tab="add" aria-selected="false">Elementos</button>
      <button class="tab" role="tab" data-tab="lay" aria-selected="false">Camadas</button>
    </div>
    <div class="pbody" id="leftbody"></div>
  </aside>

  <main class="panel" id="center">
    <div id="vp"><div id="stage"><div id="pagewrap"><div id="page"></div><div id="ov"></div></div></div></div>
  </main>

  <aside class="panel" id="right" aria-label="Propriedades">
    <div class="tabs"><div class="tab" id="rtitle" style="cursor:default;color:var(--fg)">Propriedades</div></div>
    <div class="pbody" id="rightbody"></div>
  </aside>
</div>

<div class="modal" id="expmodal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="exph">
    <div class="row"><h2 id="exph" class="grow">Exportar</h2><button class="ib" id="expx" data-ic="x"></button></div>
    <div class="field"><span class="lbl">Nome do arquivo</span><input id="expname" type="text" value="site.html"></div>
    <div class="row"><button class="btn primary grow" id="expdl"><span data-ic="download" data-s="14"></span>Baixar site (.html)</button><button class="btn" id="expcopy">Copiar HTML</button></div>
    <p class="hint" style="margin:0">O arquivo é uma página única, com a versão desktop e a versão celular. Funciona em qualquer hospedagem estática.</p>
    <div class="sec"><span class="lbl" style="margin:0">Projeto editável</span>
      <div class="row"><button class="btn grow" id="expjson"><span data-ic="download" data-s="14"></span>Salvar projeto (.json)</button><button class="btn grow" id="expopen"><span data-ic="folder" data-s="14"></span>Abrir projeto</button></div>
      <input id="openfile" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="sec"><span class="lbl" style="margin:0">Recomeçar</span>
      <button class="btn danger" id="expreset">Limpar tudo e começar do zero</button></div>
  </div>
</div>

<div class="modal" id="prevmodal" hidden>
  <div id="prevcard">
    <div id="prevbar">
      <strong class="grow">Visualização</strong>
      <div class="seg"><button id="pvd" aria-pressed="true">Desktop</button><button id="pvm" aria-pressed="false">Celular</button></div>
      <button class="ib" id="pvx" data-ic="x"></button>
    </div>
    <div id="prevbody"><iframe id="prevframe" sandbox="allow-scripts" title="Visualização do site"></iframe></div>
  </div>
</div>
<div id="toast" hidden></div>
<input id="imgfile" type="file" accept="image/*" hidden>
<script>
/* ===== Núcleo: helpers, modelo, histórico, render ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>'e'+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.round(n*100)/100;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ICONS={
undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 7.6C3.9 9.3 2 12 2 12s3.5 6 10 6a9.7 9.7 0 0 0 4-.9"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',heading:'<path d="M6 4v16M18 4v16M6 12h12"/>',
button:'<rect x="3" y="8" width="18" height="8" rx="4"/><path d="M8 12h8"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/>',
square:'<rect x="4" y="4" width="16" height="16" rx="2"/>',circle:'<circle cx="12" cy="12" r="8"/>',code:'<path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>',
desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',phone:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
play:'<path d="M7 4v16l13-8Z"/>',download:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
front:'<path d="M12 4v10M8 8l4-4 4 4M5 19h14"/>',back:'<path d="M12 20V10M8 16l4 4 4-4M5 5h14"/>',
block:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/>'};
const ic=(n,s=16)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
function paintIcons(root=document){$$('[data-ic]',root).forEach(n=>{n.innerHTML=ic(n.dataset.ic,+n.dataset.s||16)})}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ===== Modelo de elemento ===== */
const FONTS=['Instrument Sans','Bricolage Grotesque','Fraunces','DM Serif Display','JetBrains Mono','Caveat'];
const SERIF=['Fraunces','DM Serif Display'],MONO=['JetBrains Mono'];
const SHADOW={none:'none',sm:'0 1px 3px rgba(0,0,0,.18)',md:'0 8px 24px rgba(0,0,0,.18)',lg:'0 22px 54px rgba(0,0,0,.28)'};
const TYPES=['text','button','image','shape','html'];
const TYPE_DEF={
text:{name:'Texto',w:420,h:60,text:'Escreva aqui',style:{fontSize:18,fontWeight:400,fontFamily:'Instrument Sans',color:'#33403a',align:'left',lineHeight:1.5}},
button:{name:'Botão',w:180,h:52,text:'Saiba mais',href:'#',style:{fill:'#0c7a69',color:'#ffffff',fontSize:16,fontWeight:600,fontFamily:'Instrument Sans',radius:10,align:'center'}},
image:{name:'Imagem',w:360,h:240,src:'',style:{fill:'#cfd8d3',radius:12,fit:'cover'}},
shape:{name:'Forma',w:300,h:200,style:{fill:'#e3ece7',radius:12,shape:'rect'}},
html:{name:'Widget',w:360,h:220,code:'<div style="font:600 18px system-ui;height:100%;display:grid;place-items:center;background:#16211c;color:#fff;border-radius:12px">Widget HTML</div>',style:{radius:0}}};
const NUMK={fontSize:[6,400],fontWeight:[100,900],lineHeight:[.8,3],letterSpacing:[-5,40],radius:[0,999],borderWidth:[0,40],opacity:[0,1]};
const STRK=['fill','color','borderColor','align','shadow','shape','fit'];
const okCss=v=>typeof v==='string'&&v.length<260&&/^[#\w\s(),.%\-\/]+$/.test(v);
const num=(v,d)=>{v=parseFloat(v);return isFinite(v)?v:d};
function cleanStyle(s,base){
  const o={...base};if(!s||typeof s!=='object')return o;
  for(const k in NUMK){if(s[k]!=null){const n=parseFloat(s[k]);if(isFinite(n))o[k]=clamp(n,NUMK[k][0],NUMK[k][1])}}
  for(const k of STRK){if(typeof s[k]==='string'&&okCss(s[k]))o[k]=s[k]}
  if(typeof s.fontFamily==='string'&&/^[\w\s\-]{2,40}$/.test(s.fontFamily))o.fontFamily=s.fontFamily;
  if(!['left','center','right'].includes(o.align))o.align=base.align;
  if(!['rect','ellipse'].includes(o.shape))o.shape='rect';
  if(!['cover','contain'].includes(o.fit))o.fit='cover';
  if(o.shadow&&!SHADOW[o.shadow])delete o.shadow;

  if(k==='ellipse')return addEl('shape',{name:'Círculo',w:220,h:220,style:{shape:'ellipse',fill:'#f2c94c'}});
  if(k==='html')return addEl('html');
}
function dupSel(){
  const F=fr(),els=selEls();if(!els.length)return;const ids=[];
  els.forEach(e=>{const c=normEl(clone(e));c.x=e.x+20;c.y=e.y+20;c.locked=false;F.els.push(c);ids.push(c.id)});
  S.sel=ids;commit();renderAll();
}
function delSel(){const ids=S.sel.filter(id=>!(byId(id)||{}).locked);if(!ids.length)return;const F=fr();F.els=F.els.filter(e=>!ids.includes(e.id));S.sel=S.sel.filter(i=>!ids.includes(i));commit();renderAll()}
function reorder(where){
  const F=fr(),ids=S.sel;if(!ids.length)return;const mine=F.els.filter(e=>ids.includes(e.id)),rest=F.els.filter(e=>!ids.includes(e.id));
  if(where==='front')F.els=[...rest,...mine];else if(where==='back')F.els=[...mine,...rest];
  else{const a=F.els.slice();if(where==='up'){for(let i=a.length-2;i>=0;i--)if(ids.includes(a[i].id)&&!ids.includes(a[i+1].id))[a[i],a[i+1]]=[a[i+1],a[i]]}
    else{for(let i=1;i<a.length;i++)if(ids.includes(a[i].id)&&!ids.includes(a[i-1].id))[a[i],a[i-1]]=[a[i-1],a[i]]}F.els=a}
  commit();renderAll();
}
function flag(k){const els=selEls();const v=!els.every(e=>e[k]);els.forEach(e=>{if(v)e[k]=true;else delete e[k]});commit();renderAll()}
function align(how){
  const F=fr(),els=selEls().filter(e=>!e.locked);if(!els.length)return;
  const b=els.length>1?bboxOf(els):{x:0,y:0,w:F.w,h:F.h};
  els.forEach(e=>{
    if(how==='l')e.x=b.x;if(how==='c')e.x=b.x+(b.w-e.w)/2;if(how==='r')e.x=b.x+b.w-e.w;
    if(how==='t')e.y=b.y;if(how==='m')e.y=b.y+(b.h-e.h)/2;if(how==='b')e.y=b.y+b.h-e.h;
    e.x=Math.round(e.x);e.y=Math.round(e.y);
  });
  commit();renderAll();
}
function fitHeight(){const F=fr();if(!F.els.length)return;F.h=Math.round(Math.max(...F.els.map(e=>e.y+e.h))+80);commit();renderAll()}
function copySel(){const els=selEls();if(els.length){S.clip=els.map(e=>clone(e));toast('Copiado')}}
function pasteSel(){
  if(!S.clip)return;const F=fr(),ids=[];
  S.clip.forEach(r=>{const c=normEl(clone(r));c.x+=24;c.y+=24;F.els.push(c);ids.push(c.id)});
  S.clip=S.clip.map(r=>({...r,x:r.x+24,y:r.y+24}));S.sel=ids;commit();renderAll();
}
function nudge(dx,dy){const els=selEls().filter(e=>!e.locked);if(!els.length)return;els.forEach(e=>{e.x+=dx;e.y+=dy});renderCanvas();syncGeo();commitSoon()}
function switchFrame(k){if(S.editing)endEdit();flush();S.frame=k;S.sel=[];resetNodes();renderAll();fitZoom()}

  F.h=Math.max(F.h,Math.round(Math.max(...els.map(e=>e.y+e.h))+80));

/* ===== Teclado ===== */
document.addEventListener('keydown',ev=>{
  const t=ev.target,typing=t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable="plaintext-only"]');
  const mod=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();
  if(!$('#expmodal').hidden||!$('#prevmodal').hidden){if(k==='escape'){$('#expmodal').hidden=true;$('#prevmodal').hidden=true}return}
  if(typing)return;
  if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mod&&k==='y'){ev.preventDefault();redo();return}
  if(mod&&k==='c'){copySel();return}
  if(mod&&k==='v'){ev.preventDefault();pasteSel();return}
  if(mod&&k==='d'){ev.preventDefault();dupSel();return}
  if(mod&&k==='a'){ev.preventDefault();select(fr().els.filter(e=>!e.hidden).map(e=>e.id));return}
  if(k==='delete'||k==='backspace'){if(S.sel.length){ev.preventDefault();delSel()}return}
  if(k==='escape'){if(S.sel.length)select([]);return}
  if(k==='enter'&&S.sel.length===1){const e=selEls()[0],n=nodes.get(e.id);if(e&&!e.locked&&(e.type==='text'||e.type==='button')){ev.preventDefault();startEdit(e,n)}return}
  const st=ev.shiftKey?10:1;
  if(k==='arrowleft'){ev.preventDefault();nudge(-st,0)}else if(k==='arrowright'){ev.preventDefault();nudge(st,0)}
  else if(k==='arrowup'){ev.preventDefault();nudge(0,-st)}else if(k==='arrowdown'){ev.preventDefault();nudge(0,st)}
});

function fileToData(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();rd.onerror=rej;
    rd.onload=()=>{
      if(!/^image\/(png|jpe?g|webp)$/.test(f.type))return res(String(rd.result));
      const im=new Image();im.onerror=()=>res(String(rd.result));
      im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));
        if(k===1&&f.size<600e3)return res(String(rd.result));
        const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.88))};
      im.src=String(rd.result);
    };
    rd.readAsDataURL(f);
  });
}
/* ===== IA (capability sample): site inteiro, elemento único, versão celular ===== */
const SCHEMA=`Each element is a JSON object: {"type":"text|button|image|shape|html","name":string,"x":number,"y":number,"w":number,"h":number,"text":string (text and button),"href":string (button),"code":string (html),"style":{...}}.
style keys: fill (CSS color or gradient, used as background), color (text color), fontFamily (exactly one of: ${FONTS.join(', ')}), fontSize (px), fontWeight (400-800), lineHeight, letterSpacing (px), align (left|center|right), radius (px), borderWidth, borderColor, opacity (0-1), shadow (none|sm|md|lg), shape (rect|ellipse, for type shape), fit (cover|contain, for type image).
Types: "text" = headings and paragraphs (height is automatic, give a rough h); "button" = clickable button; "shape" = rectangle or circle used as background, card or divider; "image" = photo placeholder box (give it a fill color or gradient, real photos do not exist); "html" = self-contained HTML, CSS and JS widget shown in a sandboxed iframe of size w by h. Use "html" for illustrations as inline SVG, forms, calculators, tabs, carousels, charts and animations. Widgets make no network requests, load no libraries, and have a transparent body with margin 0.`;
const summ=(els,n=70)=>els.slice(0,n).map(e=>`${e.type} "${e.name}" x${Math.round(e.x)} y${Math.round(e.y)} w${Math.round(e.w)} h${Math.round(e.h)}${e.text?' "'+e.text.slice(0,40).replace(/\n/g,' ')+'"':''}${e.style&&e.style.fill?' fill '+e.style.fill:''}${e.style&&e.style.fontFamily&&e.type==='text'?' '+e.style.fontFamily:''}`).join('\n');
let ctl=null;
function setBusy(on,txt){

  $$('[data-act=gen],[data-act=genadd],[data-act=mobile],[data-act=aiedit],[data-act=chip]').forEach(b=>b.disabled=on||!SAMPLE);
}
async function runAI(prompt,label){
  ctl=new AbortController();setBusy(true,label+'…');
  try{
    return await SAMPLE.json(prompt,{signal:ctl.signal,modelTier:'default',cache:false,
      onText:({text})=>{const n=(text.match(/"type"/g)||[]).length;$('#stxt').textContent=n>1?`${label}… ${n} elementos`:label+'…'}});
  }finally{ctl=null;setBusy(false)}
}
$('#stop').onclick=()=>{if(ctl)ctl.abort()};
function aiFail(e){
  const c=e&&e.code,m={cancelled:'Cancelado.',not_granted:'Acesso à IA não autorizado. Confira a permissão ou o código de acesso.',rate_limited:'Muitas chamadas seguidas. Tente de novo em instantes.',
    invalid_json:'A resposta veio incompleta. Peça menos coisas de uma vez.',empty_completion:'A IA não respondeu. Reescreva o pedido.',refused:'A IA recusou esse pedido. Reescreva com outras palavras.',
    prompt_too_large:'O projeto ficou grande demais para enviar à IA.',session_expired:'Sua sessão expirou. Entre de novo.'};
  toast(m[c]||'Não consegui falar com a IA agora. Tente de novo.');
}
const fixBox=(e,W)=>{if(e.w>W)e.w=W;e.x=clamp(e.x,0,Math.max(0,W-e.w))};
const bottom=els=>els.length?Math.max(...els.map(e=>e.y+e.h)):0;

async function aiGenerate(add){
  const brief=S.gp.trim();if(!brief){toast('Descreva o site primeiro');const g=$('#gprompt');g&&g.focus();return}
  if(!SAMPLE||ctl)return;
  const fk=S.frame,F=fr(),W=F.w,mob=W<600,startY=add&&F.els.length?Math.round(bottom(F.els)+60):0;
  const prompt=`You are a senior web designer building a ${mob?'mobile':'desktop'} page on a free-position canvas, like Canva. Reply with ONLY one JSON object and no prose:
{"title":string,"bg":css color,"height":number,"elements":[...]}

Canvas width: ${W}px.
${SCHEMA}

Rules:
- Elements are absolutely positioned. Each one needs x>=0 and x+w<=${W}. List them back to front, background shapes first.
- ${mob?'Use a 20px side margin and a single column stack.':'Use an 80px side margin (content width 1040) and a clear grid.'} Leave 80-120px of vertical space between sections.
- Write real copy in the language of the brief, specific to the subject. No lorem ipsum.
- Choose one deliberate palette (a background tinted toward the accent, one accent, one ink color) and at most two fonts from the list. Avoid the generic purple-to-blue gradient look.
- ${add?'Create only the sections the brief asks for, about 8 to 25 elements.':'Make it complete: navigation bar, hero with headline and call to action, three or more content sections, one interactive widget when it suits the brief, and a footer. About 25 to 45 elements.'} Keep the JSON compact and omit default values.
- "height" is the page height in px and must fit every element.
${add?`\nExisting elements (match their palette, fonts and style, do not repeat them):\n${summ(F.els,40)}\nAll new elements must have y >= ${startY}.\n`:''}
Brief: ${brief}`;
  let res;try{res=await runAI(prompt,add?'Adicionando':'Gerando site')}catch(e){return aiFail(e)}
  if(!res||!Array.isArray(res.elements)||!res.elements.length){toast('A IA não devolveu elementos. Tente de novo.');return}
  const F2=S.doc.frames[fk];let els=res.elements.map(r=>normEl(r)).filter(Boolean);els.forEach(e=>fixBox(e,F2.w));
  if(add&&els.length){const minY=Math.min(...els.map(e=>e.y));if(minY<startY-10){const d=startY-minY;els.forEach(e=>e.y+=d)}}
  F2.els=add?[...F2.els,...els]:els;
  if(!add){if(typeof res.bg==='string'&&okCss(res.bg))F2.bg=res.bg;if(typeof res.title==='string'&&res.title.trim()){S.doc.name=res.title.trim().slice(0,60)}}
  F2.h=Math.round(Math.max(bottom(els)+80,add?F2.h:num(res.height,0)));
  if(fk!==S.frame)switchFrame(fk);
  S.sel=[];resetNodes();commit();renderAll();fitZoom();toast(add?'Seções adicionadas':'Site gerado. Clique em qualquer elemento para editar.');
}

async function aiEdit(){
  const e=selEls()[0],ta=$('#aiedit'),p=ta&&ta.value.trim();
  if(!e||!SAMPLE||ctl)return;if(!p){toast('Escreva o que mudar');ta&&ta.focus();return}
  const fk=S.frame,F=fr(),cur=clone(e);delete cur.id;
  const prompt=`You edit ONE element of a web page built on a free-position canvas ${F.w}px wide.
${SCHEMA}

Current element:
${JSON.stringify(cur)}

Other elements, for context only (do not change them):
${summ(F.els.filter(x=>x.id!==e.id),40)}

Instruction from the user: ${p}

Reply with ONLY this JSON, no prose:
{"patch":{...},"add":[...]}
- "patch" holds only the fields to change. "style" is merged field by field. For type html send the complete new "code". You may change "type" when the instruction needs it (for example an image becoming an html illustration).
- "add" is optional: extra new elements, only when the instruction really needs them.
- Keep x, y, w and h unless the instruction asks for a change. Keep the language of the existing copy.`;
  let res;try{res=await runAI(prompt,'Editando elemento')}catch(er){return aiFail(er)}
  if(!res||typeof res!=='object'){toast('Resposta inválida da IA');return}
  const F2=S.doc.frames[fk],i=F2.els.findIndex(x=>x.id===e.id);if(i<0)return;
  const patch=res.patch&&typeof res.patch==='object'?res.patch:(res.add?{}:res),old=F2.els[i];
  const merged={...old,...patch,id:old.id,style:{...old.style,...(patch.style&&typeof patch.style==='object'?patch.style:{})}};
  const ne=normEl(merged,true);if(old.locked)ne.locked=true;if(old.hidden)ne.hidden=true;
  F2.els[i]=ne;
  const extra=Array.isArray(res.add)?res.add.map(r=>normEl(r)).filter(Boolean):[];extra.forEach(x=>{fixBox(x,F2.w);F2.els.push(x)});
  if(fk!==S.frame)switchFrame(fk);
  S.sel=[ne.id];commit();renderAll();toast(extra.length?`Elemento atualizado e ${extra.length} novo(s) adicionado(s)`:'Elemento atualizado');
}

async function aiMobile(){
  const D0=S.doc.frames.desktop;if(!D0.els.length){toast('A versão desktop está vazia');return}
  if(!SAMPLE||ctl)return;

${SCHEMA}
Elements that carry a "ref" instead of "code" or "src" must keep the same "ref" in your output; their original content is restored for you. You may set "code" yourself only when you really need to change a widget.

Reply with ONLY JSON: {"bg":css color,"height":number,"elements":[...]}

- Headings 28 to 38px, body text 15 to 17px, buttons at least 48px tall and full width of the column when they stand alone.

  M.els=els;if(typeof res.bg==='string'&&okCss(res.bg))M.bg=res.bg;M.h=Math.round(Math.max(bottom(els)+60,num(res.height,0)));

/* ===== Fora do claude.ai: IA via /api/ai (backend próprio) e download comum ===== */
function parseLooseJSON(t){
  try{return JSON.parse(t)}catch(_){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(_){}}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>-1&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(_){}}
  throw {code:'invalid_json',message:'JSON inválido',text:t};
}
function makeRemoteSample(){
  const f=async()=>{throw {code:'upstream_error',message:'use sample.json'}};
  f.json=async(prompt,opts={})=>{
    const call=async()=>{
      const headers={'content-type':'application/json'};let code='';try{code=localStorage.getItem('telaviva.code')||''}catch(_){}
      if(code)headers['x-access-code']=code;
      return fetch('/api/ai',{method:'POST',headers,body:JSON.stringify({prompt}),signal:opts.signal});
    };
    let r;
    try{
      r=await call();
      if(r.status===401){
        const c=window.prompt('Código de acesso da IA:');
        if(!c)throw {code:'not_granted',message:'sem código'};
        try{localStorage.setItem('telaviva.code',c.trim())}catch(_){}
        r=await call();
        if(r.status===401){try{localStorage.removeItem('telaviva.code')}catch(_){}throw {code:'not_granted',message:'código inválido'}}
      }
    }catch(e){if(e&&e.code)throw e;if(e&&e.name==='AbortError')throw {code:'cancelled',message:'cancelado'};throw {code:'upstream_error',message:String(e&&e.message||e)}}
    if(r.status===429)throw {code:'rate_limited',message:'limite'};
    if(!r.ok)throw {code:'upstream_error',message:'HTTP '+r.status};
    const rd=r.body.getReader(),dec=new TextDecoder();let text='';
    try{
      for(;;){const {done,value}=await rd.read();if(done)break;const delta=dec.decode(value,{stream:true});if(delta){text+=delta;opts.onText&&opts.onText({text,delta})}}
    }catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled',message:'cancelado',text};throw {code:'upstream_error',message:String(e&&e.message||e),text}}
    if(!text.trim())throw {code:'empty_completion',message:'vazio'};
    return parseLooseJSON(text);
  };
  return f;
}
function blobDownloader(){
  return{save:async({filename,data})=>{
    const b=new Blob([data],{type:/\.json$/i.test(filename)?'application/json':'text/html;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return{status:'saved'};
  }};
}
